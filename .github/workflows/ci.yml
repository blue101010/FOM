name: CTFT catalogue gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: pip install jsonschema

      - name: Generated documents match the corpus
        run: python v3/render_taxonomy_docs.py --check

      - name: Integrity, links, relations, README, schema, wording and semantic lint
        run: python v3/catalog_audit.py --check

      - name: Typed v3 objects validate against their schemas
        run: python v3/solve.py --validate

      - name: STIX bundles match the corpus
        run: |
          python v3/render_stix.py --write
          git diff --exit-code -- stix/

      - name: No bare URLs (MD034)
        run: python v3/fix_bare_urls.py

      - name: Retrieval evaluation (informational)
        continue-on-error: true
        run: python v3/solve.py --evaluate
